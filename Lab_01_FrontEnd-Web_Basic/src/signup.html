<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        <%= htmlWebpackPlugin.options.title %>
    </title>
    <style>
        .bg-signup {
            background: linear-gradient(135deg, #eeeeee 0%, #d4d4d4 100%);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-signup p-2 sm:p-4">
    <div class="bg-white w-full max-w-xl h-auto min-h-[20rem] flex flex-col items-center gap-6 sm:gap-10 py-6 sm:py-8">
        <div class="w-full">
            <div class="h-14 mt-4 bg-red-900"></div>
            <div class="w-24 h-28 mx-auto -mt-20">
                <img class="w-full h-full" id="logo" alt="logo">
            </div>
        </div>

        <div class="text-center px-4">
            <p class="text-base sm:text-xl font-bold">Online Membership purchase and Renewals</p>
        </div>

        <div>
            <button id="signUpBtn"
                class="border border-blue-800 text-blue-800 py-2 px-10 bg-transparent hover:bg-red-900 hover:border-red-900 hover:text-white rounded-md">
                Sign up
            </button>
        </div>
    </div>
</body>

</html>
