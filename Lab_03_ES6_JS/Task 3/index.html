<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Asynchronous Data Loader</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        h1 { color: #333; }
        #loading { color: #e67e22; font-size: 18px; font-weight: bold; }

            background: #fff; padding: 15px; margin: 10px 0;

    </style>

<body>
    <h1>Asynchronous Data Loader</h1>
